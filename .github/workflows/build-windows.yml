name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tạo Release với tag này (vd v1.0.0). Bỏ trống = chỉ build.'
        required: false
        default: ''

permissions:
  contents: write   # để tạo Release

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_TRIPLET: x64-windows-static-md   # OpenEXR/OCIO link tĩnh, CRT động (/MD)
    steps:
      - uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }}
          -DEXRVIEW_BUILD_SHELLEXT=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          windeployqt --release --no-translations --no-system-d3d-compiler dist\ExrView.exe
          Compress-Archive -Path dist\* -DestinationPath ExrView-portable.zip -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc installer\ExrView.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ExrView-windows
          path: |
            installer\Output\*.exe
            ExrView-portable.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ExrView ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            **Cài đặt:** tải `ExrView-Setup-*.exe`, chạy và đồng ý quyền Admin. Sau khi cài, mở thư mục có file .exr, chọn View → Large icons để thấy thumbnail, Alt+P để bật Preview pane.

            **Không muốn cài:** tải `ExrView-portable.zip`, giải nén và chạy `ExrView.exe`. Muốn có thumbnail/preview trong Explorer thì chạy `regsvr32 ExrViewShell.dll` trong PowerShell Admin.
          files: |
            installer/Output/*.exe
            ExrView-portable.zip
